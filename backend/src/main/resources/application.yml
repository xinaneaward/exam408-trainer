server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: exam408

  # 默认使用 MySQL（毕业设计正式数据库）
  # 如需纯本地离线运行，改回 spring.profiles.active=h2
  profiles:
    active: mysql

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AI 能力配置（DeepSeek OpenAI兼容接口）
# api-key 可通过环境变量 DEEPSEEK_API_KEY 覆盖，避免密钥硬编码在仓库
ai:
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat
  temperature: 0.7
  max-tokens: 2048
  timeout-seconds: 120
  # 各功能每用户每日调用上限（落库 ai_usage_log 统计，重启不重置）
  limits:
    chat: 30
    explain: 30
    assistant: 30
    diagnosis: 10
    variant: 10

# 系统配置
exam:
  subjects:
    - 数据结构
    - 计算机组成原理
    - 操作系统
    - 计算机网络
  types:
    - 单选
    - 综合应用
  years: [2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

---
# H2 内嵌数据库配置（默认）
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/exam408;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      data-source-properties:
        characterEncoding: UTF-8
        useUnicode: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

---
# MySQL 数据库配置
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/exam408?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&useUnicode=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 凭据可通过环境变量 MYSQL_USER / MYSQL_PASSWORD 覆盖
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:596374}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
